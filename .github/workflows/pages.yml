name: pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for the page and the index
        run: python -m unittest tests.test_pages_demo tests.test_kb_index -v
      - name: Browser smoke
        env:
          SHOPASSIST_PAGES_BROWSER: "1"
          PYODIDE_CACHE: /tmp/pyodide-0.27.7
          PAGES_SCREENSHOT_DIR: /tmp/pages-shots
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest tests.test_pages_browser -v
      - name: Build the Pages artifact
        env:
          PYODIDE_CACHE: /tmp/pyodide-0.27.7
        run: python -m shopassist.pages.build --output site --base /ShoppingAssistant/ --pyodide-cache /tmp/pyodide-0.27.7
      - name: Upload the static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
