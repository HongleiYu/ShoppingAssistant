name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q shopassist tests
      - name: SDK for protocol interop test
        run: pip install -r requirements-sdk.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Mock eval
        run: python -m shopassist.cli eval --mode mock --splits regression --output reports/ci_eval.json
      - name: Training dry run
        run: |
          python -m shopassist.cli train --config configs/sft_ca_smoke.json
          python -m shopassist.cli train --config configs/sft_pa_smoke.json
      - name: Local random CPU training smoke
        run: |
          python -m shopassist.cli train --config configs/sft_ca_local_random.json --execute
          python -m shopassist.cli train --config configs/sft_pa_local_random.json --execute
