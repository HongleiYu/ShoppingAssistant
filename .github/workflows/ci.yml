name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q shopassist tests
      - name: SDK for protocol interop test
        run: pip install -r requirements-sdk.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Mock eval
        run: python -m shopassist.cli eval --mode mock --splits regression --output reports/ci_eval.json
      - name: Training dry run
        run: |
          python -m shopassist.cli train --config configs/sft_ca_smoke.json
          python -m shopassist.cli train --config configs/sft_pa_smoke.json
      - name: Local random CPU training smoke
        run: |
          python -m shopassist.cli train --config configs/sft_ca_local_random.json --execute
          python -m shopassist.cli train --config configs/sft_pa_local_random.json --execute

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shopassist
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Storage clients
        run: pip install pymysql redis
      - name: MySQL and Redis integration
        env:
          SHOPASSIST_REQUIRE_INTEGRATION: "1"
          SHOPASSIST_MYSQL_HOST: 127.0.0.1
          SHOPASSIST_MYSQL_PORT: "3306"
          SHOPASSIST_MYSQL_USER: root
          SHOPASSIST_MYSQL_PASSWORD: ""
          SHOPASSIST_MYSQL_DATABASE: shopassist
          SHOPASSIST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m unittest tests.test_memory_integration -v
